name: Daily Portfolio Check

on:
  schedule:
    # Mon–Fri at 21:00 UTC (5 PM ET, after US market close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily check
        id: check
        run: |
          python run_daily_check.py
          echo "alert=$([ -f /tmp/daily_report.html ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "rebalance=$([ -f /tmp/rebalance_needed ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Commit updated portfolio state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet || git commit -m "chore: daily check $(date +%Y-%m-%d)"
          git push

      - name: Send alert email
        if: steps.check.outputs.alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "🚨 Portfolio Alert — ${{ github.event.repository.name }}"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: file:///tmp/daily_report.html

      - name: Run full rebalance if triggered
        if: steps.check.outputs.rebalance == 'true'
        run: python run_monthly.py

      - name: Commit rebalance outputs
        if: steps.check.outputs.rebalance == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet || git commit -m "chore: triggered rebalance $(date +%Y-%m-%d)"
          git push

      - name: Send rebalance email
        if: steps.check.outputs.rebalance == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "📈 Rebalance Triggered — ${{ github.event.repository.name }}"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: file:///tmp/monthly_report.html
          attachments: /tmp/portfolio_chart.png
