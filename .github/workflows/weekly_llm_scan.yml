name: Weekly LLM Scan

on:
  schedule:
    # Every Sunday at 20:00 UTC (8 PM — after US market close)
    - cron: '0 20 * * 0'
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: write      # needed to commit outputs back to the repo

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly LLM scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_weekly.py

      - name: Commit and push outputs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet || git commit -m "chore: weekly LLM scan $(date +%Y-%m-%d)"
          git push
